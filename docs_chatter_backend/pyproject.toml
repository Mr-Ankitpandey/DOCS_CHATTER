[project]
name = "docs-chatter-backend"
version = "0.1.0"
description = "RAG-based document chatter — Phase 1 backend (text-to-text)"
requires-python =">=3.12,<3.14"
dependencies = [
    # Web framework + ASGI server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Config / validation
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Auth (JWT + password hashing + form parsing)
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.20",
    # HTTP client (used for tests + future external API calls)
    "httpx>=0.28",
    "bcrypt<5",
    "langchain>=1.2.15",
    "langchain-openai>=1.2.1",
    "langchain-pinecone>=0.2.13",
    "langchain-community>=0.4.1",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "tiktoken>=0.12.0",
    "docx2txt>=0.9",
    "supabase",
    "rank-bm25>=0.2.2",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
]
[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# ───── Tooling config ─────

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear (likely bugs)
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
